[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kit-py"
version = "0.1.0"
description = "Python media, image, PDF, and QR engine for the Kit CLI toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2024.8.6",
    "Pillow>=10.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
kit-py = "kit_py.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
