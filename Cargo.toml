[package]
name = "kit-cli"
version = "0.1.0"
edition = "2021"
authors = ["Kit Contributors"]
description = "A blazing-fast hybrid Rust + Python CLI swiss-army toolkit for media downloading, file processing, and developer utilities."
license = "MIT"
readme = "README.md"

[[bin]]
name = "kit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
md-5 = "0.10"
blake3 = "1.5"
base64 = "0.22"
hex = "0.4"
walkdir = "2.5"
rayon = "1.10"
indicatif = "0.17"
console = "0.15"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
